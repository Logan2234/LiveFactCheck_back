# Single source of project config: deps in [project], tooling in [tool.*].
# For tooling, only values that differ from a tool's defaults are set — defaults
# are intentionally omitted to keep this file readable.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livefactchecker-backend"
version = "0.1.0"
description = "LiveFactChecker backend: audio → transcription → claim verification."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.0.0",
    "ruff>=0.4.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "websockets>=16.0",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0.0",
    "anthropic>=0.40.0",
    "numpy>=2.4.6",
    "pyjwt>=2.8.0",
    "psutil>=7.2.2",
    "sqlalchemy>=2.0.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

# GPU transcription (WHISPER_DEVICE=cuda): CUDA 12 runtime libs that ctranslate2
# needs but doesn't bundle. Install with `pip install -e ".[gpu]"` on a machine
# with an NVIDIA GPU. cuDNN is pinned to 9.x (the major ctranslate2 4.7 expects).
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9.0,<10",
]

# Discover app/ and its subpackages (api, core, schemas, services, models).
[tool.setuptools.packages.find]
include = ["app*"]

# ──────────────────────────────────────────────────────────────────────────────
# Ruff (lint + format)
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 88
src = ["."]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg",
    ".mypy_cache", ".nox", ".pants.d", ".pyenv",
    ".pytest_cache", ".pytype", ".ruff_cache", ".svn",
    ".tox", ".venv", "__pypackages__", "_build",
    "buck-out", "build", "dist", "node_modules", "venv",
]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

# Ruff lints only E/F by default. We opt into a broader, opinionated set: the
# usual style/pyflakes rules plus import sorting, modern-syntax upgrades,
# bugbears, comprehension/idiom and simplification checks. Each is a curated
# group, not "everything" — ALL would drag in noisy, project-hostile rules.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import order)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern syntax: list[str], X | None…)
    "B",    # flake8-bugbear (likely bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "PIE",  # flake8-pie (misc idioms)
    "RUF",  # Ruff-specific rules
]
ignore = [
    # FastAPI's whole API is "callable in argument default" (Depends, File,
    # Query…). It's the documented pattern, not a bug — B008 is a false positive here.
    "B008",
]

[tool.ruff.lint.isort]
# Treat our own package as first-party so it lands in its own import group.
known-first-party = ["app"]

# ──────────────────────────────────────────────────────────────────────────────
# Pyright (type checking). CI runs `pyright app/`; this mirrors the old pyrightconfig.json.
# ──────────────────────────────────────────────────────────────────────────────
[tool.pyright]
include = ["app"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false

# ──────────────────────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]

# ──────────────────────────────────────────────────────────────────────────────
# Coverage (pytest-cov / coverage.py) — reporting only, no failure threshold yet.
# ──────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
